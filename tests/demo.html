<!doctype html>
<!--
  kanban-gantt demo page — renders the Gantt with the EXACT pure logic shipped
  in plugin.js (extracts GANTT_CORE_SRC at runtime), against the standalone
  backend (plugin_api.py). Used by tests/demo_playwright.py to prove the
  rendering without the desktop app.

  Usage: demo.html?api=http://127.0.0.1:8765
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>kanban-gantt — demo</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --ui-background: #ffffff; --ui-text-secondary: #555; --ui-text-tertiary: #888;
    --ui-text-quaternary: #bbb; --ui-stroke-secondary: #ddd; --ui-stroke-tertiary: #eee;
    --ui-accent: #2563eb; --ui-accent-soft: #93b8f5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font: 13px/1.4 system-ui, sans-serif; padding: 16px; color: #222; background: var(--ui-background); display: flex; flex-direction: column; }
  h1 { font-size: 15px; display: flex; gap: 8px; align-items: center; margin: 0 0 4px; }
  h1 .count { color: var(--ui-text-tertiary); font-size: 11px; font-weight: 400; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; shrink: 0; }
  .controls input, .controls select { font: inherit; padding: 2px 6px; border: 1px solid var(--ui-stroke-secondary); border-radius: 4px; background: transparent; }
  .controls input[type=search] { width: 220px; }
  .legend { display: flex; gap: 12px; font-size: 10px; color: var(--ui-text-tertiary); margin: 4px 0; }
  .legend .sw { display: inline-block; width: 16px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  #status { font-size: 11px; color: var(--ui-text-tertiary); margin: 2px 0; shrink: 0; }
  #scroller { border: 1px solid var(--ui-stroke-tertiary); border-radius: 6px; flex: 1 1 0; min-height: 0; overflow: auto; position: relative; }
  .kg-row { display: grid; width: max-content; min-width: 100%; border-bottom: 1px solid color-mix(in srgb, var(--ui-stroke-tertiary) 50%, transparent); height: 28px; align-items: center; }
  .kg-row .label { position: sticky; left: 0; z-index: 10; background: var(--ui-background); display: flex; align-items: center; gap: 6px; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kg-row .label button { all: unset; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; flex: 1; min-width: 0; }
  .kg-row .label button:hover { color: var(--ui-accent); }
  .kg-row .label .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .kg-row .track { position: relative; height: 28px; overflow: hidden; }
  .kg-bar { position: absolute; border-radius: 3px; height: 14px; top: 7px; }
  .kg-bar.done { background: var(--ui-accent); }
  .kg-bar.progress { background: var(--ui-accent-soft); border: 1px solid var(--ui-stroke-secondary); opacity: .8; }
  .kg-bar.todo { border: 1px dashed var(--ui-text-tertiary); background: transparent; }
  .kg-bar.archived { background: var(--ui-text-quaternary); opacity: .6; }
  /* Machine-activity arc — same visual vocabulary as the official kanban plugin */
  @property --kg-arc-angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .kg-arc {
    pointer-events: none; position: absolute; inset: -2px; border-radius: 4px; padding: 1.5px;
    background: conic-gradient(from var(--kg-arc-angle), transparent 0deg,
      var(--kanban-tone, var(--ui-stroke-primary)) 55deg, transparent 110deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: kg-arc-spin 2.2s linear infinite;
  }
  @keyframes kg-arc-spin { to { --kg-arc-angle: 360deg; } }
  .kg-ruler { display: grid; position: sticky; top: 0; z-index: 20; background: var(--ui-background); border-bottom: 1px solid var(--ui-stroke-secondary); font-size: 10px; color: var(--ui-text-tertiary); }
  .kg-ruler .tick { position: absolute; top: 0; }
  .kg-ruler .tick .line { width: 1px; height: 6px; background: var(--ui-stroke-tertiary); }
  .kg-weekend-band { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,0.04); pointer-events: none; z-index: 0; }
  @media (prefers-color-scheme: dark) {
    .kg-weekend-band { background: rgba(255,255,255,0.035); }
  }
  #drawer { display: none; position: fixed; inset: 0 0 0 auto; width: 400px; border-left: 1px solid var(--ui-stroke-secondary); background: var(--ui-background); box-shadow: -8px 0 24px rgba(0,0,0,.12); padding: 16px; overflow: auto; z-index: 50; }
  #drawer.open { display: block; }
  #drawer h2 { font-size: 14px; margin: 0 0 8px; }
  #drawer h1.d-title { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
  #drawer .badge { display: inline-block; border: 1px solid var(--ui-stroke-secondary); border-radius: 999px; padding: 1px 8px; font-size: 10px; margin-right: 4px; }
  #drawer .status-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid transparent; }
  .status-dropdown { position: absolute; z-index: 60; margin-top: 4px; min-width: 9rem; border: 1px solid var(--ui-stroke-secondary); border-radius: 6px; background: var(--ui-background); box-shadow: 0 4px 12px rgba(0,0,0,.15); padding: 4px 0; }
  .status-item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  .status-item:hover { background: #f3f4f6; }
  @media (prefers-color-scheme: dark) {
    .status-item:hover { background: rgba(255,255,255,0.08); }
  }
  .markdown-body { font-size: 11px; line-height: 1.5; color: var(--ui-text-secondary); }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-size: 12px; font-weight: 600; margin: 6px 0 2px; color: #222; }
  .markdown-body p { margin: 4px 0; }
  .markdown-body ul, .markdown-body ol { margin: 4px 0; padding-left: 16px; }
  .markdown-body code { font-family: monospace; font-size: 10px; background: rgba(150,150,150,0.15); padding: 1px 3px; border-radius: 3px; }
  .markdown-body pre { background: #1e1e1e; color: #d4d4d4; padding: 8px; border-radius: 4px; overflow-x: auto; margin: 4px 0; font-size: 10.5px; }
  .markdown-body pre code { background: none; padding: 0; color: inherit; }
  .markdown-body table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 10.5px; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--ui-stroke-tertiary); padding: 3px 6px; text-align: left; }
  .markdown-body th { background: rgba(150,150,150,0.1); font-weight: 600; }
  #drawer .status-item .pt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #drawer .status-item .cur { margin-left: auto; opacity: .6; }
  #drawer .deps { font-size: 11px; margin-bottom: 8px; color: var(--ui-text-secondary); }
  #drawer .more-wrap { position: relative; display: inline-block; }
  #drawer .more-menu { position: absolute; z-index: 60; margin-top: 4px; min-width: 9rem; border: 1px solid var(--ui-stroke-secondary); border-radius: 6px; background: var(--ui-background); box-shadow: 0 4px 24px rgba(0,0,0,.15); padding: 4px 0; }
  #drawer .body { font-size: 11px; white-space: pre-wrap; border: 1px solid var(--ui-stroke-tertiary); border-radius: 4px; padding: 8px; max-height: 120px; overflow: auto; }
  #drawer .actions { margin: 10px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #drawer button.act { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--ui-stroke-secondary); border-radius: 4px; background: transparent; cursor: pointer; }
  #drawer button.act:hover { border-color: var(--ui-accent); color: var(--ui-accent); }
  #drawer .comment { font-size: 11px; margin-bottom: 6px; }
  #drawer .comment .who { color: var(--ui-text-tertiary); }
  #drawer .err { color: #c00; font-size: 10px; margin-top: 6px; }
  #drawer .close { float: right; cursor: pointer; border: none; background: none; font-size: 14px; }
  .kg-row.odd { background-color: rgba(0,0,0,0.02); }
  @media (prefers-color-scheme: dark) {
    .kg-row.odd { background-color: rgba(255,255,255,0.02); }
  }
  .kg-row.checked { background-color: rgba(96,165,250,0.08); }
  .kg-row.selected { background-color: rgba(96,165,250,0.18) !important; }
  .kg-row.selected .label button { font-weight: 700; color: var(--ui-accent); }
  .kg-row .label { position: sticky; left: 0; z-index: 10; background: var(--ui-background); display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 300px; box-sizing: border-box; }
  .bulk-bar { display: none; position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 40; align-items: center; gap: 8px; padding: 6px 14px; background: var(--ui-bg-elevated, #1e1e1e); border: 1px solid var(--ui-stroke-secondary); border-radius: 8px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); font-size: 11px; shrink: 0; }
  .bulk-bar.open { display: flex; }
  .bulk-bar button { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--ui-stroke-secondary); border-radius: 4px; background: var(--ui-background); cursor: pointer; }
  .bulk-bar button:hover { border-color: var(--ui-accent); color: var(--ui-accent); }
  .filter-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid var(--ui-stroke-secondary); border-radius: 4px; background: transparent; cursor: pointer; font-size: 11px; }
  .filter-btn:hover { background: var(--ui-bg-subtle, rgba(0,0,0,0.04)); }
  .filter-btn.active { background: rgba(96,165,250,0.18); border-color: var(--ui-accent); color: var(--ui-accent); }
  .filter-dropdown { position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 13rem; border: 1px solid var(--ui-stroke-secondary); border-radius: 6px; background: var(--ui-background); box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 4px 0; z-index: 50; display: none; }
  .filter-dropdown.open { display: block; }
  .filter-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 11px; cursor: pointer; }
  .filter-item:hover { background: rgba(0,0,0,0.04); }
  .filter-item .check { margin-left: auto; font-size: 11px; color: var(--ui-accent); }
  .filter-item .profile-avatar { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; font-weight: 600; shrink: 0; }
  .filter-sep { height: 1px; background: var(--ui-stroke-tertiary); margin: 4px 0; }
  .footer-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--ui-stroke-tertiary); font-size: 10px; color: var(--ui-text-tertiary); shrink: 0; }
  .footer-legend .item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; transition: opacity 0.2s; }
  .footer-legend .item:hover { opacity: 0.8; }
  .footer-legend .item.excluded { opacity: 0.35; text-decoration: line-through; }
  .footer-legend .sw { width: 10px; height: 10px; border-radius: 2px; }
  .header-count-badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; margin-left: 6px; border: 1px solid transparent; cursor: help; }
</style>
</head>
<body>
  <div class="controls" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <div style="display:inline-flex;align-items:center;gap:4px">
      <h1 style="margin:0;font-size:15px;display:inline-flex;align-items:center;font-weight:600">Gantt Kanban <span id="header-badge" class="header-count-badge"></span><span id="header-warning-badge" class="header-count-badge" style="display:none;margin-left:4px;color:#f87171;background:rgba(248,113,113,0.18);border-color:rgba(248,113,113,0.4)"></span></h1>
      <div style="position:relative;display:inline-block;margin-left:4px">
        <button id="filter-btn" class="filter-btn" title="Filtres">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 2h13l-5 6.5v5l-3-2v-3l-5-6.5z"/></svg>
        </button>
        <div id="filter-dropdown" class="filter-dropdown">
          <div style="padding:4px 12px;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--ui-text-tertiary)">Profils</div>
          <div class="filter-item" id="filter-all-profiles">
            <span style="font-weight:600">All profiles</span>
            <span class="check" id="check-all-profiles">✓</span>
          </div>
          <div id="filter-profiles-list"></div>
          <div class="filter-sep"></div>
          <div style="padding:4px 12px;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--ui-text-tertiary)">États</div>
          <div id="filter-statuses-list"></div>
          <div class="filter-sep"></div>
          <div class="filter-item" id="filter-show-archived">
            <span>Show archived</span>
            <span class="check" id="check-show-archived" style="display:none">✓</span>
          </div>
        </div>
      </div>
      <div style="display:inline-flex;align-items:center;gap:4px;padding:2px 4px;margin-left:4px">
        <span style="color:var(--ui-text-quaternary);font-size:12px">🔍</span>
        <input type="search" id="search" placeholder="Filtrer les cartes…" style="border:none;background:transparent;font-size:12px;color:var(--ui-text-primary);outline:none;width:180px">
      </div>
    </div>
    <div style="display:inline-flex;align-items:center;margin:0 auto">
      <select id="board" title="Choisir le board kanban" style="font:inherit;font-size:12px;font-weight:500;padding:2px 8px;border:1px solid var(--ui-stroke-secondary);border-radius:6px;background:var(--ui-bg-subtle, transparent);cursor:pointer"></select>
    </div>
    <span style="display:inline-flex;align-items:center;gap:6px">
      <input type="range" id="zoom2" min="0.2" max="1.8" step="0.05" value="1" style="width:90px">
      <span id="zoomval2" style="font-size:10px;color:var(--ui-text-tertiary);width:32px;text-align:right;flex-shrink:0">100%</span>
    </span>
  </div>
  <div id="bulk-bar" class="bulk-bar">
    <span id="bulk-count" style="font-weight:600"></span>
    <span style="color:var(--ui-text-tertiary)">État :</span>
    <button class="bulk-btn" data-action="ready">Ready</button>
    <button class="bulk-btn" data-action="todo">Todo</button>
    <button class="bulk-btn" data-action="done">Done</button>
    <button class="bulk-btn" data-action="blocked">Bloquer</button>
    <button class="bulk-btn" data-action="archive">Archiver</button>
    <span style="color:var(--ui-text-tertiary);margin-left:6px">Assigner :</span>
    <input type="text" id="bulk-assignee-input" placeholder="profil" style="width:90px;font:inherit;font-size:11px;padding:2px 6px;border:1px solid var(--ui-stroke-secondary);border-radius:4px;background:var(--ui-background)">
    <button id="bulk-assign-btn" class="act">OK</button>
    <button id="bulk-clear" style="margin-left:auto;border:none;background:none;color:var(--ui-text-tertiary);cursor:pointer">Tout désélectionner (Esc)</button>
  </div>
  <div id="status">chargement…</div>
  <div id="scroller"></div>
  <div class="footer-legend" id="footer-legend">
    <span class="item" data-status="ready"><span class="sw" style="background:#60a5fa"></span>Ready</span>
    <span class="item" data-status="running"><span class="sw" style="background:#34d399"></span>Running</span>
    <span class="item" data-status="review"><span class="sw" style="background:#fbbf24"></span>Review</span>
    <span class="item" data-status="blocked"><span class="sw" style="background:#f87171"></span>Blocked</span>
    <span class="item" data-status="scheduled"><span class="sw" style="background:#a78bfa"></span>Scheduled</span>
    <span class="item" data-status="todo"><span class="sw" style="background:var(--ui-text-secondary)"></span>Todo</span>
    <span class="item" data-status="triage"><span class="sw" style="background:var(--ui-text-tertiary)"></span>Triage</span>
    <span class="item" data-status="done"><span class="sw" style="background:var(--ui-text-tertiary)"></span>Done</span>
    <span class="item" data-status="archived"><span class="sw" style="background:var(--ui-text-quaternary)"></span>Archived</span>
  </div>

    <div id="drawer" role="dialog" style="display:none;position:fixed;inset:0 0 0 auto;width:420px;max-width:100%;border-left:1px solid var(--ui-stroke-secondary);background:var(--ui-background);box-shadow:-8px 0 24px rgba(0,0,0,.15);padding:16px;z-index:50;flex-direction:column;gap:10px">
      <!-- Pinned top section: header, actions and title with bottom separator -->
      <div style="display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--ui-stroke-tertiary);flex-shrink:0">
        <!-- Top header row -->
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
          <div id="d-badges" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px"></div>
          <div style="display:flex;align-items:center;gap:4px;position:relative">
            <button id="d-more-btn" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;background:transparent;cursor:pointer;border-radius:4px;color:var(--ui-text-secondary);padding:0" title="Menu actions">
              <span style="font-size:14px;line-height:1;letter-spacing:1px">…</span>
            </button>
            <div id="d-more-dropdown" class="status-dropdown" style="display:none;right:28px;top:0;left:auto;min-width:11rem">
              <div class="status-item" id="d-copy-id">Copy task id</div>
              <div class="status-item" id="d-copy-title">Copy title</div>
              <div class="filter-sep" id="d-more-sep" style="display:none"></div>
              <div id="d-more-actions"></div>
              <div class="filter-sep"></div>
              <div class="status-item" id="d-delete-task" style="color:#ef4444">Supprimer</div>
            </div>
            <button class="close" id="close" style="font-size:16px;border:none;background:none;cursor:pointer;padding:0 4px">✕</button>
          </div>
        </div>

        <!-- Action bar ABOVE the title -->
        <div id="d-primary-actions-wrap" style="display:none;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:10px;text-transform:uppercase;font-weight:600;color:var(--ui-text-tertiary);margin-right:2px">Action :</span>
          <div id="d-primary-actions" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        </div>

        <!-- Title kept always visible -->
        <h1 class="d-title" id="d-title" style="margin:0;font-size:15px;font-weight:600;line-height:1.3"></h1>
      </div>

      <!-- Scrollable content underneath the pinned header + title -->
      <div id="d-scroll-content" style="flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-top:4px">
        <div id="d-deps" class="deps"></div>
        <div id="d-desc-wrap" style="display:none">
          <div style="font-size:10px;text-transform:uppercase;font-weight:600;color:var(--ui-text-tertiary);margin-bottom:4px">Description</div>
          <div class="body markdown-body" id="d-body"></div>
        </div>
        <div id="d-result-wrap" style="display:none">
          <div style="font-size:10px;text-transform:uppercase;font-weight:600;color:var(--ui-text-tertiary);margin-bottom:4px">Résultat</div>
          <div class="body markdown-body" id="d-result"></div>
        </div>
        <div id="d-summary-wrap" style="display:none">
          <div style="font-size:10px;text-transform:uppercase;font-weight:600;color:var(--ui-text-tertiary);margin-bottom:4px">Dernier résumé</div>
          <div class="body markdown-body" id="d-summary"></div>
        </div>
        <div id="d-runs-wrap" style="display:none">
          <button id="d-runs-toggle" type="button" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:none;cursor:pointer;padding:4px 0;color:inherit;font:inherit">
            <div style="display:flex;align-items:center;gap:6px">
              <span id="d-runs-arrow" style="font-size:10px;color:var(--ui-text-tertiary);user-select:none">▶</span>
              <span id="d-runs-title" style="font-size:10px;text-transform:uppercase;font-weight:600;color:var(--ui-text-tertiary)">Exécutions</span>
            </div>
            <span id="d-runs-toggle-text" style="font-size:10px;color:var(--ui-text-quaternary)">Afficher</span>
          </button>
          <div id="d-runs" style="display:none;flex-direction:column;gap:6px;margin-top:4px"></div>
        </div>
        <div class="err" id="d-err"></div>
        <div id="d-comments-wrap" style="border-top:1px solid var(--ui-stroke-tertiary);padding-top:8px">
          <button id="d-comments-toggle" type="button" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:none;cursor:pointer;padding:4px 0;color:inherit;font:inherit">
            <div style="display:flex;align-items:center;gap:6px">
              <span id="d-comments-arrow" style="font-size:10px;color:var(--ui-text-tertiary);user-select:none">▼</span>
              <span id="d-comments-title" style="font-size:10px;text-transform:uppercase;font-weight:600;color:var(--ui-text-tertiary)">Commentaires</span>
            </div>
            <span id="d-comments-toggle-text" style="font-size:10px;color:var(--ui-text-quaternary)">Masquer</span>
          </button>
          <div id="d-comments-content" style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
            <button id="d-show-prev-comments" type="button" style="display:none;font-size:10.5px;color:var(--ui-accent);background:none;border:none;text-align:left;cursor:pointer;padding:2px 0">↑ Afficher les commentaires précédents</button>
            <div id="d-comments" style="display:flex;flex-direction:column;gap:6px"></div>
            <div style="display:flex;gap:6px;margin-top:4px">
              <input id="d-comment" type="text" placeholder="Add a comment…" style="flex:1;font:inherit;font-size:11px;padding:4px 8px;border:1px solid var(--ui-stroke-secondary);border-radius:4px;background:transparent">
              <button id="d-send" class="act">Comment</button>
            </div>
          </div>
        </div>
      </div>
    </div>

<script type="module">
const params = new URLSearchParams(location.search)
// default: same-origin /api proxy (demo-server.mjs); can be overridden with ?api=http://…
const API = (params.get('api') || `${location.origin}/api`).replace(/\/+$/, '')

// ── load the SHIPPED pure logic from plugin.js (no copy) ──
const pluginSrc = await (await fetch('./plugin.js', { cache: 'no-store' })).text()
const m = pluginSrc.match(/const GANTT_CORE_SRC = String\.raw`([\s\S]*?)`/)
if (!m) { document.getElementById('status').textContent = 'GANTT_CORE_SRC introuvable dans plugin.js'; throw new Error('no core') }
const core = new Function(`${m[1]};\nreturn { barRange, taskBars, shortId, matchesSearch, buildRows, computeDomain, ticks, tickUnit, statusTone, DAY, MIN_BAR }`)()
window.__KG_CORE = core

const $ = id => document.getElementById(id)
const api = (path, init) => fetch(`${API}${path}`, init).then(r => {
  if (!r.ok) throw new Error(`HTTP ${r.status}`)
  return r.json()
})

let BOARD = params.get('board') || ''
let DATA = null
let BOARDS = []            // [{slug, label}]
let SELECTED_IDS = new Set()
let LAST_CHECKED_ID = null
let SELECTED_ASSIGNEES = new Set()
let DISABLED_STATUSES = (() => {
  try {
    const raw = localStorage.getItem('kg_disabled_statuses')
    if (raw) return new Set(JSON.parse(raw))
  } catch {}
  return new Set()
})()
let SHOW_ARCHIVED = false
let ZOOM = (() => {
  try {
    const saved = localStorage.getItem('kg_zoom')
    if (saved && Number.isFinite(Number(saved))) return Number(saved)
  } catch {}
  return 1
})()
$('zoom2').value = String(ZOOM)
$('zoomval2').textContent = `${Math.round(ZOOM * 100)}%`

async function loadBoards() {
  BOARDS = (await api('/boards')).boards
  // prefer the current pointer, but only if that board actually exists in
  // this sandbox (HERMES_KANBAN_BOARD from the outer env may point elsewhere)
  const slugs = BOARDS.map(b => b.slug)
  if (BOARD !== 'all') {
    BOARD = (slugs.includes(BOARD) ? BOARD
      : slugs.includes('hermes-plugins') ? 'hermes-plugins'
      : slugs[0]) || ''
  }
  // populate the board selector
  const sel = $('board')
  const allOption = `<option value="all" ${BOARD === 'all' ? 'selected' : ''}>Tous les boards</option>`
  sel.innerHTML = allOption + BOARDS.map(b =>
    `<option value="${b.slug}" ${b.slug === BOARD ? 'selected' : ''}>${b.label || b.slug}</option>`).join('')
}

function cleanTitle(title, label) {
  if (!title) return '(sans titre)'
  let t = title.trim()
  if (t.startsWith('[')) {
    const idx = t.indexOf(']')
    if (idx > 0) {
      t = t.slice(idx + 1).trim()
    }
  }
  return t || title
}

async function loadBoard() {
  DATA = await api(`/gantt?board=${encodeURIComponent(BOARD)}`)
  window.__KG_DATA = DATA
  updateFilterMenu()
  render()
}

function profileColor(name) {
  if (!name || name === 'default') return null
  let hash = 0
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0
  const hue = hash % 360
  return `hsl(${hue} 68% 58%)`
}

function updateFilterMenu() {
  const allAssignees = Array.from(new Set((DATA?.tasks || []).map(t => t.assignee).filter(Boolean))).sort()
  const list = $('filter-profiles-list')
  list.innerHTML = allAssignees.map(name => {
    const isChecked = SELECTED_ASSIGNEES.has(name)
    const color = profileColor(name)
    const parts = name.split(/[\s_\-./]+/).filter(Boolean)
    const init = `${parts[0]?.[0] ?? '?'}${parts[1]?.[0] ?? ''}`.toUpperCase()
    const bg = color ? `color-mix(in srgb, ${color} 22%, transparent)` : 'rgba(150,150,150,0.15)'
    const fg = color || 'var(--ui-text-secondary)'
    return `<div class="filter-item profile-item" data-name="${name}">
      <span class="profile-avatar" style="background:${bg};color:${fg}">${init}</span>
      <span style="flex:1">${name}</span>
      <span class="check" style="${isChecked ? '' : 'display:none'}">✓</span>
    </div>`
  }).join('')

  list.querySelectorAll('.profile-item').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.name
      if (SELECTED_ASSIGNEES.has(name)) SELECTED_ASSIGNEES.delete(name)
      else SELECTED_ASSIGNEES.add(name)
      updateFilterMenu()
      render()
    })
  })

  // Status list in dropdown
  const ALL_STATUS_KEYS = ['ready', 'running', 'review', 'blocked', 'scheduled', 'todo', 'triage', 'done']
  const TONES = {
    triage: 'var(--ui-text-tertiary)', todo: 'var(--ui-text-secondary)',
    scheduled: '#a78bfa', ready: '#60a5fa', running: '#34d399',
    blocked: '#f87171', review: '#fbbf24', done: 'var(--ui-text-tertiary)',
    archived: 'var(--ui-text-quaternary)'
  }
  const LABELS = { triage: 'Triage', todo: 'Todo', scheduled: 'Scheduled', ready: 'Ready', running: 'Running', blocked: 'Blocked', review: 'Review', done: 'Done' }
  const sList = $('filter-statuses-list')
  sList.innerHTML = ALL_STATUS_KEYS.map(s => {
    const isVisible = !DISABLED_STATUSES.has(s)
    const tone = TONES[s]
    const label = LABELS[s] || s
    return `<div class="filter-item status-filter-item" data-status="${s}">
      <span style="width:8px;height:8px;border-radius:50%;background:${tone};flex:none"></span>
      <span style="flex:1;${isVisible ? '' : 'text-decoration:line-through;opacity:.5'}">${label}</span>
      <span class="check" style="${isVisible ? '' : 'display:none'}">✓</span>
    </div>`
  }).join('')

  sList.querySelectorAll('.status-filter-item').forEach(el => {
    el.addEventListener('click', () => {
      const s = el.dataset.status
      if (DISABLED_STATUSES.has(s)) DISABLED_STATUSES.delete(s)
      else DISABLED_STATUSES.add(s)
      try { localStorage.setItem('kg_disabled_statuses', JSON.stringify([...DISABLED_STATUSES])) } catch {}
      updateFilterMenu()
      render()
    })
  })

  // Footer legend status sync
  document.querySelectorAll('#footer-legend .item').forEach(el => {
    const s = el.dataset.status
    if (DISABLED_STATUSES.has(s)) el.classList.add('excluded')
    else el.classList.remove('excluded')
  })

  $('check-all-profiles').style.display = SELECTED_ASSIGNEES.size === 0 ? 'inline' : 'none'
  $('check-show-archived').style.display = SHOW_ARCHIVED ? 'inline' : 'none'

  const active = SELECTED_ASSIGNEES.size > 0 || DISABLED_STATUSES.size > 0 || SHOW_ARCHIVED
  if (active) $('filter-btn').classList.add('active')
  else $('filter-btn').classList.remove('active')
}

function render() {
  if (!DATA) return
  let visible = DATA.tasks.filter(t => SHOW_ARCHIVED || !t.archived)
  if (DISABLED_STATUSES.size > 0) {
    visible = visible.filter(t => !DISABLED_STATUSES.has(t.status))
  }
  if (SELECTED_ASSIGNEES.size > 0) {
    visible = visible.filter(t => t.assignee && SELECTED_ASSIGNEES.has(t.assignee))
  }
  const q = $('search').value
  visible = visible.filter(t => core.matchesSearch(t, q))
  const rows = core.buildRows(visible)
  const dom = core.computeDomain(visible)

  // Status priority for the count badge
  const TONES = {
    triage: 'var(--ui-text-tertiary)', todo: 'var(--ui-text-secondary)',
    scheduled: '#a78bfa', ready: '#60a5fa', running: '#34d399',
    blocked: '#f87171', review: '#fbbf24', done: 'var(--ui-text-tertiary)',
    archived: 'var(--ui-text-quaternary)'
  }
  const STATUS_PRIORITY = ['blocked', 'running', 'review', 'ready', 'scheduled', 'todo', 'triage', 'done', 'archived']
  let dominantStatus = 'todo'
  const present = new Set(visible.map(t => t.status))
  for (const s of STATUS_PRIORITY) {
    if (present.has(s)) { dominantStatus = s; break }
  }
  const dominantTone = TONES[dominantStatus] || 'var(--ui-text-secondary)'
  const badgeEl = $('header-badge')
  badgeEl.textContent = String(visible.length)
  badgeEl.title = `${visible.length} tâche${visible.length > 1 ? 's au total' : ' au total'} (état prioritaire : ${dominantStatus})`
  badgeEl.style.backgroundColor = `color-mix(in srgb, ${dominantTone} 18%, transparent)`
  badgeEl.style.borderColor = `color-mix(in srgb, ${dominantTone} 40%, transparent)`
  badgeEl.style.color = dominantTone

  const blockedCount = visible.filter(t => t.status === 'blocked').length
  const warnBadge = $('header-warning-badge')
  if (blockedCount > 0) {
    warnBadge.style.display = 'inline-flex'
    warnBadge.innerHTML = `⚠️ <span style="margin-left:3px">${blockedCount}</span>`
    warnBadge.title = `${blockedCount} tâche${blockedCount > 1 ? 's bloquées (nécessitent une intervention)' : ' bloquée (nécessite une intervention)'}`
  } else {
    warnBadge.style.display = 'none'
  }

  // bulk bar
  const bulkBar = $('bulk-bar')
  if (SELECTED_IDS.size > 0) {
    bulkBar.classList.add('open')
    $('bulk-count').textContent = `${SELECTED_IDS.size} sélectionnée${SELECTED_IDS.size > 1 ? 's' : ''}`
  } else {
    bulkBar.classList.remove('open')
  }

  const scroller = $('scroller')
  const prevScrollTop = scroller.scrollTop
  const prevScrollLeft = scroller.scrollLeft
  scroller.innerHTML = ''
  if (!dom || !rows.length) {
    $('status').textContent = 'Aucune tâche.'
    return
  }
  $('status').textContent = ''

  const visibleWidth = Math.max(scroller.clientWidth - 300 - 24, 300)
  // At zoom = 1 (100%), exactly 1 week (7 days) fills the visible timeline width
  const baseDayWidth = visibleWidth / 7
  const basePerSec = baseDayWidth / core.DAY
  const pxPerSec = basePerSec * ZOOM
  const timelineW = Math.ceil((dom.max - dom.min) * pxPerSec)
  const now = Date.now() / 1000

  // ruler
  const unit = core.tickUnit(dom.max - dom.min)
  const dayWidth = pxPerSec * core.DAY
  const showWeekday = unit === 'day' && dayWidth >= 50
  const rulerHeight = showWeekday ? 32 : 24

  const ruler = document.createElement('div')
  ruler.className = 'kg-ruler'
  ruler.style.gridTemplateColumns = `300px ${timelineW}px`
  ruler.style.height = `${rulerHeight}px`
  const isAllChecked = rows.length > 0 && rows.every(r => SELECTED_IDS.has(r.task.id))
  const isIndeterminate = rows.some(r => SELECTED_IDS.has(r.task.id)) && !isAllChecked
  ruler.innerHTML = `<div style="position:sticky;left:0;z-index:20;background:var(--ui-background);border-right:1px solid var(--ui-stroke-tertiary);height:${rulerHeight}px;display:flex;align-items:center;padding:0 8px;gap:6px">
    <input type="checkbox" id="select-all-chk" ${isAllChecked ? 'checked' : ''} style="cursor:pointer" title="Tout sélectionner / désélectionner">
    <span style="font-size:10px;text-transform:uppercase;color:var(--ui-text-tertiary);font-weight:600">Tâches</span>
  </div><div style="position:relative">${core.ticks(dom.min, dom.max, unit).map(t => {
    const left = Math.round((t - dom.min) * pxPerSec)
    const d = new Date(t * 1000)
    const label = unit === 'month'
      ? d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' })
      : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    const weekday = showWeekday
      ? `<div style="padding-left:2px;font-size:8.5px;font-weight:600;color:var(--ui-text-tertiary);line-height:1;padding-top:2px">${d.toLocaleDateString(undefined, { weekday: 'short' }).replace(/\./g, '').slice(0, 3).toUpperCase()}</div>`
      : ''
    return `<div class="tick" style="left:${left}px"><div class="line"></div>${weekday}<div style="padding-left:2px;line-height:1.2">${label}</div></div>`
  }).join('')}</div>`
  const selectAllEl = ruler.querySelector('#select-all-chk')
  if (selectAllEl) {
    selectAllEl.indeterminate = isIndeterminate
    selectAllEl.addEventListener('change', e => {
      if (e.target.checked) {
        rows.forEach(r => SELECTED_IDS.add(r.task.id))
      } else {
        SELECTED_IDS.clear()
      }
      render()
    })
  }
  scroller.appendChild(ruler)

  // weekend background overlay behind rows
  const bandsContainer = document.createElement('div')
  bandsContainer.style.position = 'relative'
  bandsContainer.style.width = 'max-content'
  bandsContainer.style.minWidth = '100%'

  let weekendBandsHtml = ''
  let curT = Math.floor(dom.min / core.DAY) * core.DAY
  while (curT <= dom.max) {
    const d = new Date(curT * 1000)
    const dow = d.getUTCDay()
    if (dow === 0 || dow === 6) {
      const left = Math.round((curT - dom.min) * pxPerSec) + 300
      const width = Math.round(core.DAY * pxPerSec)
      weekendBandsHtml += `<div class="kg-weekend-band" style="left:${left}px;width:${width}px"></div>`
    }
    curT += core.DAY
  }
  bandsContainer.innerHTML = weekendBandsHtml

  // rows
  for (let idx = 0; idx < rows.length; idx++) {
    const row = rows[idx]
    const t = row.task
    const bars = core.taskBars ? core.taskBars(t, now) : (core.barRange(t, now) ? [core.barRange(t, now)] : [])
    const el = document.createElement('div')
    const isSelected = window.__KG_CURRENT_TASK === t.id
    const isChecked = SELECTED_IDS.has(t.id)
    const isOdd = idx % 2 === 1
    el.className = 'kg-row' + (isOdd ? ' odd' : '') + (isChecked ? ' checked' : '') + (isSelected ? ' selected' : '')
    el.style.gridTemplateColumns = `300px ${timelineW}px`
    const depth = row.depth * 12 + 8
    const isBlocked = t.status === 'blocked'
    const tone = core.statusTone ? core.statusTone(t.status) : 'var(--ui-text-tertiary)'
    const color = bars.length === 0 ? 'var(--ui-text-quaternary)' : (bars[bars.length - 1].tone || tone)
    const d = cleanTitle(t.title, t.label)
    const labelText = d

    let track = '<span class="text-quaternary" style="color:var(--ui-text-quaternary);font-size:10px">—</span>'
    if (bars.length > 0) {
      track = bars.map(bar => {
        const left = Math.round((bar.t0 - dom.min) * pxPerSec)
        const width = Math.max(Math.round((bar.t1 - bar.t0) * pxPerSec), 2)
        const arc = (t.status === 'running' || bar.isOngoing)
          ? `<div class="kg-arc" style="--kanban-tone:${bar.tone || tone}"></div>` : ''
        if (bar.kind === 'progress') {
          // gauge: pale track bordered in the status tone + strong fill child
          return `<div class="kg-bar progress" style="left:${left}px;width:${width}px;background:color-mix(in srgb, ${bar.tone || tone} 22%, transparent);border:1px solid ${bar.tone || tone};cursor:pointer" title="${t.title}">
              <div style="position:absolute;left:0;top:0;bottom:0;width:100%;background:${bar.tone || tone};opacity:.75;border-radius:2px"></div>
              ${arc}
            </div>`
        } else if (bar.kind === 'done') {
          const tone2 = (bar.tone && bar.tone !== 'var(--ui-text-tertiary)') ? bar.tone : '#60a5fa'
          return `<div class="kg-bar done" style="left:${left}px;width:${width}px;background:${tone2};opacity:.85;cursor:pointer" title="${t.title}"></div>`
        } else if (bar.kind === 'done-instant') {
          const tone2 = (bar.tone && bar.tone !== 'var(--ui-text-tertiary)') ? bar.tone : '#60a5fa'
          return `<div class="kg-bar done" style="left:${left}px;width:${width}px;background:${tone2};opacity:.55;border-radius:999px;cursor:pointer" title="${t.title} · durée inconnue"></div>`
        } else {
          // queued: dashed bar bordered in the STATUS tone (blue for ready…)
          return `<div class="kg-bar ${bar.kind}" style="left:${left}px;width:${width}px;border:1px dashed ${bar.tone || tone};background:transparent;cursor:pointer" title="${t.title}"></div>`
        }
      }).join('')
    }
    const indicator = isBlocked
      ? '<span style="color:#f87171;font-size:11px;margin-right:2px;display:inline-flex;align-items:center" title="Tâche bloquée">⚠️</span>'
      : `<span class="dot" style="background:${color};margin-left:2px;margin-right:2px"></span>`

    const isRunning = t.status === 'running'
    const titleArc = isRunning ? `<div class="kg-arc" style="--kanban-tone:${color}"></div>` : ''
    const showBoardBadge = (BOARD === 'all' || BOARD === '*') && t.board
    const boardBadgeHtml = showBoardBadge
      ? `<span class="board-badge" style="font-family:monospace;font-size:9px;padding:1px 4px;border-radius:3px;border:1px solid var(--ui-stroke-secondary);color:var(--ui-text-tertiary);line-height:1.2;margin-right:4px;flex-shrink:0;white-space:nowrap" title="Board : ${t.board}">${t.board}</span>`
      : ''

    el.innerHTML = `
      <div class="label" style="padding-left:${depth}px">
        <input type="checkbox" class="row-chk" data-task="${t.id}" ${isChecked ? 'checked' : ''} style="cursor:pointer;margin-right:2px">
        ${indicator}
        ${boardBadgeHtml}
        <button data-task="${t.id}" title="${showBoardBadge ? `[${t.board}] ` : ''}${t.title} (${t.id})" style="position:relative;display:inline-flex;align-items:center;padding:2px 4px;border-radius:4px">${titleArc}${labelText}</button>
      </div>
      <div class="track">${track}</div>`

    el.style.cursor = 'pointer'
    el.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') return
      if (e.shiftKey || e.ctrlKey || e.metaKey) {
        const checked = !SELECTED_IDS.has(t.id)
        const taskIds = rows.map(r => r.task.id)
        if (e.shiftKey && LAST_CHECKED_ID && taskIds.includes(LAST_CHECKED_ID)) {
          const lastIdx = taskIds.indexOf(LAST_CHECKED_ID)
          const curIdx = taskIds.indexOf(t.id)
          const [start, end] = lastIdx < curIdx ? [lastIdx, curIdx] : [curIdx, lastIdx]
          for (let i = start; i <= end; i++) {
            if (checked) SELECTED_IDS.add(taskIds[i])
            else SELECTED_IDS.delete(taskIds[i])
          }
        } else {
          if (checked) SELECTED_IDS.add(t.id)
          else SELECTED_IDS.delete(t.id)
        }
        LAST_CHECKED_ID = t.id
        render()
      } else {
        openTask(t.id)
      }
    })

    el.querySelector('.row-chk').addEventListener('click', e => {
      e.stopPropagation()
      const checked = e.target.checked
      const taskIds = rows.map(r => r.task.id)
      if (e.shiftKey && LAST_CHECKED_ID && taskIds.includes(LAST_CHECKED_ID)) {
        const lastIdx = taskIds.indexOf(LAST_CHECKED_ID)
        const curIdx = taskIds.indexOf(t.id)
        const [start, end] = lastIdx < curIdx ? [lastIdx, curIdx] : [curIdx, lastIdx]
        for (let i = start; i <= end; i++) {
          if (checked) SELECTED_IDS.add(taskIds[i])
          else SELECTED_IDS.delete(taskIds[i])
        }
      } else {
        if (checked) SELECTED_IDS.add(t.id)
        else SELECTED_IDS.delete(t.id)
      }
      LAST_CHECKED_ID = t.id
      render()
    })
    el.querySelector('.row-chk').addEventListener('change', e => e.stopPropagation())
    bandsContainer.appendChild(el)
  }
  scroller.appendChild(bandsContainer)

  if (!window.__KG_HAS_SCROLLED_ONCE) {
    window.__KG_HAS_SCROLLED_ONCE = true
    scroller.scrollLeft = scroller.scrollWidth
  } else {
    scroller.scrollTop = prevScrollTop
    scroller.scrollLeft = prevScrollLeft
  }
}

function renderMd(text) {
  if (!text) return ''
  if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
    return marked.parse(text)
  }
  return text.replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

async function openTask(id) {
  if (window.__KG_CURRENT_TASK !== id) {
    const sc = $('d-scroll-content')
    if (sc) sc.scrollTop = 0
  }
  window.__KG_CURRENT_TASK = id
  render()
  const d = await api(`/tasks/${encodeURIComponent(id)}?board=${encodeURIComponent(BOARD)}`)
  const task = d.task
  $('d-title').textContent = cleanTitle(task.title, task.label)
  $('d-title').className = 'd-title'

  // status badge — official Kanban tones + dropdown of active statuses (no archive/delete)
  const TONES = {
    triage: 'var(--ui-text-tertiary)', todo: 'var(--ui-text-secondary)',
    scheduled: '#a78bfa', ready: '#60a5fa', running: '#34d399',
    blocked: '#f87171', review: '#fbbf24', done: 'var(--ui-text-tertiary)',
    archived: 'var(--ui-text-quaternary)'
  }
  const LABELS = { triage: 'Triage', todo: 'Todo', scheduled: 'Scheduled', ready: 'Ready', running: 'Running', blocked: 'Blocked', review: 'Review', done: 'Done' }
  const tone = TONES[task.status] || 'var(--ui-text-secondary)'
  const isRunning = task.status === 'running'
  const arcBadge = isRunning ? `<div class="kg-arc" style="--kanban-tone:${tone}"></div>` : ''
  const badge = document.createElement('div')
  badge.style.position = 'relative'
  badge.style.display = 'inline-block'
  badge.innerHTML = `<button class="status-badge" style="position:relative;background:color-mix(in srgb, ${tone} 18%, transparent);border-color:color-mix(in srgb, ${tone} 45%, transparent)">
      ${arcBadge}
      <span class="pt" style="width:8px;height:8px;border-radius:50%;background:${tone}"></span>
      ${LABELS[task.status] || task.status}<span style="font-size:9px;opacity:.6">▾</span>
    </button>`
  const dd = document.createElement('div')
  dd.className = 'status-dropdown'
  dd.style.display = 'none'
  for (const s of ['triage', 'todo', 'ready', 'blocked', 'running', 'review', 'done']) {
    const item = document.createElement('div')
    item.className = 'status-item'
    const cur = s === task.status
    item.innerHTML = `<span class="pt" style="background:${TONES[s]}"></span>${LABELS[s]}${cur ? '<span class="cur">✓</span>' : ''}`
    item.addEventListener('click', async () => {
      dd.style.display = 'none'
      if (cur) return
      const map = { done: 'done', blocked: 'blocked', ready: 'ready', todo: 'todo', review: 'review', triage: 'triage', scheduled: 'ready', running: null }
      const action = map[s]
      if (!action) return
      try {
        await api(`/tasks/${encodeURIComponent(id)}/status?board=${encodeURIComponent(BOARD)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action })
        })
        await loadBoard()
        await openTask(id)
      } catch (e) { $('d-err').textContent = String(e) }
    })
    dd.appendChild(item)
  }
  badge.appendChild(dd)
  badge.querySelector('button').addEventListener('click', () => {
    dd.style.display = dd.style.display === 'none' ? 'block' : 'none'
  })

  // assignee dropdown badge
  const allAssignees = Array.from(new Set((DATA?.tasks || []).map(t => t.assignee).filter(Boolean))).sort()
  const aBadge = document.createElement('div')
  aBadge.style.position = 'relative'
  aBadge.style.display = 'inline-block'
  const currentAssignee = task.assignee || 'Non assigné'
  const aColor = profileColor(task.assignee)
  const aBg = aColor ? `color-mix(in srgb, ${aColor} 22%, transparent)` : 'rgba(150,150,150,0.15)'
  const aInit = task.assignee ? task.assignee.slice(0, 2).toUpperCase() : '👤'
  aBadge.innerHTML = `<button class="status-badge" style="background:var(--ui-background);border:1px solid var(--ui-stroke-secondary)">
    <span class="profile-avatar" style="background:${aBg};color:${aColor || 'var(--ui-text-secondary)'};width:14px;height:14px;font-size:7px">${aInit}</span>
    ${currentAssignee}<span style="font-size:9px;opacity:.6">▾</span>
  </button>`
  const add = document.createElement('div')
  add.className = 'status-dropdown'
  add.style.display = 'none'
  const unassignItem = document.createElement('div')
  unassignItem.className = 'status-item'
  unassignItem.innerHTML = `<span style="color:var(--ui-text-tertiary)">Non assigné (vide)</span>${!task.assignee ? '<span class="cur">✓</span>' : ''}`
  unassignItem.addEventListener('click', async () => {
    add.style.display = 'none'
    try {
      await api(`/tasks/${encodeURIComponent(id)}/assignee?board=${encodeURIComponent(BOARD)}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: '' })
      })
      await loadBoard()
      await openTask(id)
    } catch (e) { $('d-err').textContent = String(e) }
  })
  add.appendChild(unassignItem)
  allAssignees.forEach(name => {
    const item = document.createElement('div')
    item.className = 'status-item'
    const isCur = name === task.assignee
    const col = profileColor(name)
    const bgCol = col ? `color-mix(in srgb, ${col} 22%, transparent)` : 'rgba(150,150,150,0.15)'
    item.innerHTML = `<span class="profile-avatar" style="background:${bgCol};color:${col || 'var(--ui-text-secondary)'};width:14px;height:14px;font-size:7px">${name.slice(0, 2).toUpperCase()}</span><span style="flex:1">${name}</span>${isCur ? '<span class="cur">✓</span>' : ''}`
    item.addEventListener('click', async () => {
      add.style.display = 'none'
      try {
        await api(`/tasks/${encodeURIComponent(id)}/assignee?board=${encodeURIComponent(BOARD)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: name })
        })
        await loadBoard()
        await openTask(id)
      } catch (e) { $('d-err').textContent = String(e) }
    })
    add.appendChild(item)
  })
  aBadge.appendChild(add)
  aBadge.querySelector('button').addEventListener('click', () => {
    add.style.display = add.style.display === 'none' ? 'block' : 'none'
  })

  $('d-badges').innerHTML = ''
  $('d-badges').appendChild(badge)
  $('d-badges').appendChild(aBadge)
  const sid = core.shortId ? core.shortId(task.id) : task.id
  $('d-badges').insertAdjacentHTML('beforeend', `<span style="font-size:11px;font-family:monospace;color:var(--ui-text-quaternary);cursor:help" title="${task.id} — cliquer sur [...] pour copier">${sid}</span>`)

  // description
  if (task.body) {
    $('d-desc-wrap').style.display = 'block'
    $('d-body').innerHTML = renderMd(task.body)
  } else {
    $('d-desc-wrap').style.display = 'none'
  }

  // result
  if (task.result) {
    $('d-result-wrap').style.display = 'block'
    $('d-result').innerHTML = renderMd(task.result)
  } else {
    $('d-result-wrap').style.display = 'none'
  }

  // latest summary
  if (task.latest_summary) {
    $('d-summary-wrap').style.display = 'block'
    const isBlocked = task.status === 'blocked'
    const isDone = task.status === 'done'
    const summaryBg = isBlocked
      ? 'background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);border-radius:6px;padding:8px 10px;'
      : isDone
      ? 'background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.3);border-radius:6px;padding:8px 10px;'
      : ''
    $('d-summary').style.cssText = summaryBg
    $('d-summary').innerHTML = renderMd(task.latest_summary)
  } else {
    $('d-summary-wrap').style.display = 'none'
  }

  // runs
  const runs = task.runs || []
  if (runs.length) {
    $('d-runs-wrap').style.display = 'block'
    $('d-runs-title').textContent = `Exécutions (${runs.length})`
    $('d-runs').innerHTML = runs.map(r => {
      const failed = ['crashed', 'failed', 'timed_out', 'gave_up'].includes(r.outcome || r.status)
      const badgeStyle = failed
        ? 'background:rgba(239,68,68,0.2);color:#ef4444;border:1px solid rgba(239,68,68,0.4)'
        : 'background:rgba(156,163,175,0.2);color:var(--ui-text-secondary);border:1px solid var(--ui-stroke-secondary)'
      const dateStr = r.started_at ? new Date(r.started_at * 1000).toLocaleString() : ''
      const isDiffProfile = r.profile && task.assignee && r.profile !== task.assignee
      const durationStr = (() => {
        if (!r.started_at) return ''
        const end = r.ended_at || Math.floor(Date.now() / 1000)
        const sec = Math.max(0, end - r.started_at)
        if (sec < 60) return `${sec}s`
        if (sec < 3600) return `${Math.floor(sec / 60)}m`
        const h = Math.floor(sec / 3600)
        const m = Math.floor((sec % 3600) / 60)
        return m > 0 ? `${h}h ${m}m` : `${h}h`
      })()

      return `<div style="border:1px solid var(--ui-stroke-tertiary);border-radius:4px;padding:6px;font-size:11px">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10px">
          <span style="border-radius:4px;padding:1px 6px;font-weight:600;${badgeStyle}">${r.outcome || r.status || 'run'}</span>
          ${r.profile ? `<span style="font-weight:500;color:${isDiffProfile ? '#f59e0b;font-weight:600' : 'var(--ui-text-secondary)'}">👤 ${r.profile}${isDiffProfile ? ' <span style="font-size:9px;color:var(--ui-text-quaternary)">(réaffecté)</span>' : ''}</span>` : ''}
          ${durationStr ? `<span style="color:var(--ui-text-tertiary)">⏱ ${durationStr}</span>` : ''}
          <span style="margin-left:auto;color:var(--ui-text-quaternary);font-size:9.5px">${dateStr}</span>
        </div>
        ${r.summary ? `<div class="markdown-body" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--ui-stroke-tertiary)">${renderMd(r.summary)}</div>` : ''}
      </div>`
    }).join('')
  } else {
    $('d-runs-wrap').style.display = 'none'
  }

  $('d-err').textContent = ''
  // dependencies (Blocked by / Blocks) with short titles
  const deps = task.dependencies || []
  $('d-deps').innerHTML = deps.length
    ? 'Dépendances : ' + deps.map(d =>
        `<span title="${d.id}">${d.relation === 'parent' ? '⬅' : '➡'} ${d.title}</span>`).join(' · ')
    : ''

  // Action matrix
  const MATRIX = {
    triage:   { primary: [['todo', 'Mettre à Todo']], more: [['blocked', 'Bloquer'], ['archive', 'Archiver']] },
    todo:     { primary: [['ready', 'Mettre à Ready']], more: [['blocked', 'Bloquer'], ['review', 'Demander review'], ['archive', 'Archiver']] },
    scheduled:{ primary: [['ready', 'Mettre à Ready']], more: [['blocked', 'Bloquer'], ['archive', 'Archiver']] },
    ready:    { primary: [['done', 'Terminer'], ['blocked', 'Bloquer']], more: [['review', 'Demander review'], ['archive', 'Archiver']] },
    running:  { primary: [['done', 'Terminer'], ['review', 'Demander review']], more: [['blocked', 'Bloquer']] },
    blocked:  { primary: [['ready', 'Débloquer']], more: [['review', 'Demander review'], ['archive', 'Archiver']] },
    review:   { primary: [['done', 'Approuver (done)'], ['reopen', 'Réouvrir']], more: [['blocked', 'Bloquer']] },
    done:     { primary: [['archive', 'Archiver']], more: [['ready', 'Rouvrir (ready)']] },
    archived: { primary: [['done', 'Restaurer (done)']], more: [] }
  }
  const m = MATRIX[task.status] || { primary: [], more: [] }
  const doAction = async (action) => {
    try {
      await api(`/tasks/${encodeURIComponent(id)}/status?board=${encodeURIComponent(BOARD)}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action })
      })
      await loadBoard()
      await openTask(id)
    } catch (e) { $('d-err').textContent = String(e) }
  }

  // Primary action buttons ABOVE the title
  $('d-primary-actions').innerHTML = ''
  if ((m.primary || []).length) {
    $('d-primary-actions-wrap').style.display = 'flex'
    for (const [action, label] of m.primary) {
      const b = document.createElement('button')
      b.className = 'act'
      b.textContent = label
      b.addEventListener('click', () => doAction(action))
      $('d-primary-actions').appendChild(b)
    }
  } else {
    $('d-primary-actions-wrap').style.display = 'none'
  }

  // [...] More-actions dropdown in top right header
  const moreActions = m.more || []
  const moreWrap = $('d-more-actions')
  moreWrap.innerHTML = ''
  if (moreActions.length) {
    $('d-more-sep').style.display = 'block'
    for (const [action, label] of moreActions) {
      const item = document.createElement('div')
      item.className = 'status-item'
      item.textContent = label
      item.addEventListener('click', () => {
        $('d-more-dropdown').style.display = 'none'
        doAction(action)
      })
      moreWrap.appendChild(item)
    }
  } else {
    $('d-more-sep').style.display = 'none'
  }

  $('d-copy-id').onclick = () => {
    $('d-more-dropdown').style.display = 'none'
    navigator.clipboard.writeText(task.id)
  }
  $('d-copy-title').onclick = () => {
    $('d-more-dropdown').style.display = 'none'
    navigator.clipboard.writeText(task.title || '')
  }
  $('d-delete-task').onclick = async () => {
    $('d-more-dropdown').style.display = 'none'
    if (confirm(`Supprimer définitivement la tâche ${task.id} ?`)) {
      try {
        await api(`/tasks/${encodeURIComponent(id)}/status?board=${encodeURIComponent(BOARD)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete' })
        })
        $('drawer').style.display = 'none'
        window.__KG_CURRENT_TASK = null
        await loadBoard()
      } catch (e) { $('d-err').textContent = String(e) }
    }
  }

  const allComments = task.comments || []
  $('d-comments-title').textContent = `Commentaires (${allComments.length})`

  function renderCommentsList() {
    const list = SHOW_ALL_COMMENTS ? allComments : allComments.slice(-3)
    const hidden = allComments.length - list.length
    const showPrevBtn = $('d-show-prev-comments')
    if (hidden > 0) {
      showPrevBtn.style.display = 'block'
      showPrevBtn.textContent = `↑ Afficher les ${hidden} commentaires précédents`
    } else {
      showPrevBtn.style.display = 'none'
    }

    $('d-comments').innerHTML = list.map(c => {
      const dateStr = c.created_at
        ? new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(c.created_at * 1000))
        : ''
      return `<div style="border:1px solid var(--ui-stroke-tertiary);border-radius:4px;padding:6px;font-size:11px">
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;margin-bottom:2px">
          <span style="font-weight:600;color:var(--ui-text-secondary)">${c.author || '?'}</span>
          <span style="margin-left:auto;color:var(--ui-text-quaternary);font-size:9.5px">${dateStr}</span>
        </div>
        <div class="markdown-body">${renderMd(c.body)}</div>
      </div>`
    }).join('')
  }
  renderCommentsList()
  window.__KG_RENDER_COMMENTS = renderCommentsList
  $('drawer').style.display = 'flex'
}

$('d-more-btn').addEventListener('click', e => {
  e.stopPropagation()
  const dd = $('d-more-dropdown')
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none'
})
document.addEventListener('click', e => {
  if (!e.target.closest('#d-more-dropdown') && !e.target.closest('#d-more-btn')) {
    $('d-more-dropdown').style.display = 'none'
  }
})

// footer legend click toggle
document.querySelectorAll('#footer-legend .item').forEach(el => {
  el.addEventListener('click', () => {
    const s = el.dataset.status
    if (s === 'archived') {
      SHOW_ARCHIVED = !SHOW_ARCHIVED
    } else {
      if (DISABLED_STATUSES.has(s)) DISABLED_STATUSES.delete(s)
      else DISABLED_STATUSES.add(s)
    }
    try { localStorage.setItem('kg_disabled_statuses', JSON.stringify([...DISABLED_STATUSES])) } catch {}
    updateFilterMenu()
    render()
  })
})

$('filter-btn').addEventListener('click', e => {
  e.stopPropagation()
  $('filter-dropdown').classList.toggle('open')
})
document.addEventListener('click', e => {
  if (!e.target.closest('#filter-dropdown') && !e.target.closest('#filter-btn')) {
    $('filter-dropdown').classList.remove('open')
  }
})
$('filter-all-profiles').addEventListener('click', () => {
  SELECTED_ASSIGNEES.clear()
  updateFilterMenu()
  render()
})
$('filter-show-archived').addEventListener('click', () => {
  SHOW_ARCHIVED = !SHOW_ARCHIVED
  updateFilterMenu()
  render()
})

// Global keyboard shortcuts (Ctrl+A / Cmd+A to select all, Escape to deselect)
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return
    if (SELECTED_IDS.size > 0 && DATA?.tasks?.length) {
      e.preventDefault()
      let visible = DATA.tasks.filter(t => SHOW_ARCHIVED || !t.archived)
      if (SELECTED_ASSIGNEES.size > 0) {
        visible = visible.filter(t => t.assignee && SELECTED_ASSIGNEES.has(t.assignee))
      }
      const q = $('search').value
      visible = visible.filter(t => core.matchesSearch(t, q))
      visible.forEach(t => SELECTED_IDS.add(t.id))
      render()
    }
  } else if (e.key === 'Escape') {
    if (SELECTED_IDS.size > 0) {
      SELECTED_IDS.clear()
      render()
    }
  }
})

// bulk action buttons
document.querySelectorAll('.bulk-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const action = btn.dataset.action
    if (!action || !SELECTED_IDS.size) return
    try {
      await api(`/tasks/bulk?board=${encodeURIComponent(BOARD)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...SELECTED_IDS], action })
      })
      SELECTED_IDS.clear()
      await loadBoard()
    } catch (e) {
      alert(String(e))
    }
  })
})
$('bulk-assign-btn').addEventListener('click', async () => {
  const profile = $('bulk-assignee-input').value.trim()
  if (!SELECTED_IDS.size) return
  try {
    await api(`/tasks/bulk?board=${encodeURIComponent(BOARD)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: [...SELECTED_IDS], assignee: profile })
    })
    $('bulk-assignee-input').value = ''
    SELECTED_IDS.clear()
    await loadBoard()
  } catch (e) {
    alert(String(e))
  }
})
$('bulk-assignee-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('bulk-assign-btn').click()
})
$('bulk-clear').addEventListener('click', () => {
  SELECTED_IDS.clear()
  render()
})

$('close').addEventListener('click', () => {
  $('drawer').style.display = 'none'
  window.__KG_CURRENT_TASK = null
  render()
})
let RUNS_OPEN = false
$('d-runs-toggle').addEventListener('click', () => {
  RUNS_OPEN = !RUNS_OPEN
  $('d-runs').style.display = RUNS_OPEN ? 'flex' : 'none'
  $('d-runs-arrow').textContent = RUNS_OPEN ? '▼' : '▶'
  $('d-runs-toggle-text').textContent = RUNS_OPEN ? 'Masquer' : 'Afficher'
})

let COMMENTS_OPEN = true
let SHOW_ALL_COMMENTS = false
$('d-comments-toggle').addEventListener('click', () => {
  COMMENTS_OPEN = !COMMENTS_OPEN
  if (!COMMENTS_OPEN) {
    SHOW_ALL_COMMENTS = false // reset when collapsing
  }
  $('d-comments-content').style.display = COMMENTS_OPEN ? 'flex' : 'none'
  $('d-comments-arrow').textContent = COMMENTS_OPEN ? '▼' : '▶'
  $('d-comments-toggle-text').textContent = COMMENTS_OPEN ? 'Masquer' : 'Afficher'
  if (COMMENTS_OPEN && window.__KG_RENDER_COMMENTS) {
    window.__KG_RENDER_COMMENTS()
  }
})

$('d-show-prev-comments').addEventListener('click', () => {
  SHOW_ALL_COMMENTS = true
  if (window.__KG_RENDER_COMMENTS) {
    window.__KG_RENDER_COMMENTS()
  }
})

$('search').addEventListener('input', render)
// comment input (like the official kanban drawer)
$('d-send').addEventListener('click', async () => {
  const body = $('d-comment').value.trim()
  if (!body || !window.__KG_CURRENT_TASK) return
  try {
    await api(`/tasks/${encodeURIComponent(window.__KG_CURRENT_TASK)}/comments?board=${encodeURIComponent(BOARD)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body, author: 'demo' })
    })
    $('d-comment').value = ''
    await openTask(window.__KG_CURRENT_TASK)
  } catch (e) { $('d-err').textContent = String(e) }
})
$('d-comment').addEventListener('keydown', e => { if (e.key === 'Enter') $('d-send').click() })
$('board').addEventListener('change', async e => {
  BOARD = e.target.value
  window.__KG_HAS_SCROLLED_ONCE = false
  const url = new URL(window.location.href)
  url.searchParams.set('board', BOARD)
  window.history.replaceState({}, '', url.toString())
  await loadBoard()
})
$('zoom2').addEventListener('input', e => {
  ZOOM = Number(e.target.value)
  try { localStorage.setItem('kg_zoom', String(ZOOM)) } catch {}
  $('zoomval2').textContent = `${Math.round(ZOOM * 100)}%`
  render()
})
window.addEventListener('resize', render)

await loadBoards()
await loadBoard()
window.__KG_READY = true
</script>
</body>
</html>
